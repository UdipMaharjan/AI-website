<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top AI Projects - Team Collaboration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: gold;
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
            /* Add space for fixed footer */
        }

        #home-nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid #d4af37;
            border-radius: 50px;
            padding: 12px 20px;
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.3);
            z-index: 1000;
        }

        #home-nav a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            padding: 12px 24px;
            margin: 0 4px;
            border-radius: 30px;
            transition: all 0.3s ease;
            position: relative;
        }

        #home-nav a:hover {
            color: #000;
            background: linear-gradient(45deg, #d4af37, #ffd700);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        #home-nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: #ffd700;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        #home-nav a:hover::after {
            width: 80%;
        }

        #home-nav a.active {
            background: linear-gradient(45deg, #d4af37, #ffd700);
            color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>

<body>
    <!-- Navigation - Friend 1 will work here -->
    <!-- Khrishman (feature/home-nav) works here -->
    <header>
        <nav id="home-nav">
            <a href="#home">Home</a>
            <a href="#projects">Projects</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Banner - Friend 3 will work here -->
    <section id="home-banner">
        <!-- Prabesh (feature/home-banner) works here -->
    </section>

    <!-- About - Friend 4 will work here -->
    <section id="home-about">
        <!-- Saransh (feature/home-about) works here -->
    </section>

    <!-- Projects - Friend 2 will work here -->
    <section id="home-projects">
        <!-- Raynard (feature/home-projects) works here -->
    </section>

    <!-- Footer -->
    <footer
        style="background-color: #000; color: gold; text-align: center; padding: 20px 0; box-shadow: 0 -2px 5px rgba(255, 215, 0, 0.3); position: fixed; width: 100%; bottom: 0; left: 0;">
        <nav>
            <a href="#home" style="color: gold; margin: 0 15px; font-weight: bold; text-decoration: none;">Home</a>
            <a href="#about" style="color: gold; margin: 0 15px; font-weight: bold; text-decoration: none;">About</a>
            <a href="#projects"
                style="color: gold; margin: 0 15px; font-weight: bold; text-decoration: none;">Projects</a>
        </nav>
        <p style="margin-top: 10px; font-size: 14px; margin-bottom: 0;">&copy; 2025 Udip Team. All rights reserved.</p>
    </footer>

</body>

</html>
